services:
  - type: web
    name: bankshot-relay
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: BANKSHOT_PROFILE_FILE
        value: /var/data/profiles.json
    disk:
      name: bankshot-profiles
      mountPath: /var/data
      sizeGB: 1
